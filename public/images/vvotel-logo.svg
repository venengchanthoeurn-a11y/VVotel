<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="vvotelBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0043dc"/>
      <stop offset="100%" stop-color="#0035b2"/>
    </linearGradient>
    <linearGradient id="vvotelGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdbb2d"/>
      <stop offset="50%" stop-color="#f4981c"/>
      <stop offset="100%" stop-color="#d67b0c"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#001850" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Blue Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#vvotelBlue)"/>

  <!-- Left Base Foot -->
  <rect x="76" y="380" width="108" height="20" rx="10" fill="#ffffff"/>

  <!-- Right Base Foot -->
  <rect x="328" y="380" width="108" height="20" rx="10" fill="#ffffff"/>

  <!-- Left Outer Column Line -->
  <line x1="86" y1="386" x2="238" y2="114" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

  <!-- Right Outer Column Line -->
  <line x1="426" y1="386" x2="274" y2="114" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

  <!-- Top Peak Cap -->
  <path d="M 238 114 L 256 100 L 274 114" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner Gateway Arch -->
  <path d="M 174 386 L 256 254 L 338 386" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Vertical Spine -->
  <line x1="256" y1="254" x2="256" y2="198" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>

  <!-- Golden Diamond Gem with White Outline -->
  <polygon points="256,112 288,182 256,252 224,182" fill="url(#vvotelGold)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
</svg>